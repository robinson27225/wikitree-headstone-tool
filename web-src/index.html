<body>
<header class="top">
  <a class="brand" href="#/">Headstone Photo Tool</a>
  <nav id="topnav"></nav>
</header>
<main id="app"><p class="muted">Loading…</p></main>

<script>

  window.HW_CONFIG = { apiBase: new URLSearchParams(location.search).get('api') || undefined };
</script>
<script src="lib/md5.js?v=__VERSION__"></script>
